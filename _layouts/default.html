<!DOCTYPE html>
<html lang="{{ site.lang | default: 'bn' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
 <header class="site-header">
  <div class="header-container">
    <!-- লোগো বা সাইটের নাম -->
    <a href="{{ site.baseurl }}/" class="site-logo">INFOORBIT</a>

    <!-- মূল নেভিগেশন মেনু -->
    <nav class="main-nav">
      <ul>
        <li><a href="{{ site.baseurl }}/">Home</a></li>
        
        <!-- ড্রপডাউন মেনু: Marketing -->
        <li class="dropdown">
          <a href="#">Marketing <i class="arrow-down">▾</i></a>
          <ul class="dropdown-menu">
            <li><a href="{{ site.baseurl }}/categories/business/">Business</a></li>
            <li><a href="{{ site.baseurl }}/categories/digital-marketing/">Digital Marketing</a></li>
            <li><a href="{{ site.baseurl }}/categories/marketing-psychology/">Marketing Psychology</a></li>
          </ul>
        </li>

        <li><a href="{{ site.baseurl }}/categories/todays-technology/">Today's Technology</a></li>
        <li><a href="{{ site.baseurl }}/categories/recent-news/">Recent News</a></li>
        <li><a href="{{ site.baseurl }}/about.html">About Us</a></li>
      </ul>
    </nav>
  </div>
</header>
  <main class="wrapper">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      &copy; {{ 'now' | date: "%Y" }} {{ site.title }} — {{ site.author.name }} | <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
</body>
</html>
